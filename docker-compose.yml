version: "3.8"

services:
  codex-json-rpc:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ./auth.json:/app/auth.json:ro
      - ./workspace:/workspace
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
